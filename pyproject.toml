[project]
name = "treefort"
version = "0.5.0b1"
description = "github CLI extension for worktrees"
readme = "README.md"
authors = [
    { name = "Blaine Jester", email = "bjester@quavalent.com" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["git", "github", "worktree", "cli", "development"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
    "Typing :: Typed"
]
dependencies = [
    "fire>=0.7.1",
    "tomlkit>=0.15.0",
]

[project.scripts]
treefort = "treefort.cli:main"

[project.urls]
Homepage = "https://github.com/bjester/treefort"
Repository = "https://github.com/bjester/treefort"
Issues = "https://github.com/bjester/treefort/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "exceptiongroup; python_version < '3.11'",
    "prek",
    "pyinstaller",
    "ruff>=0.15.10",
    "pex>=2.88.1"
]

[build-system]
requires = ["uv_build>=0.9.17,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "T10", "C90", "UP", "B", "A", "PTH"]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.uv.build-backend]
source-exclude = [
    ".envrc",
    ".idea/",
    ".gh/",
    ".treefort/",
    ".git/",
    "playground/",
    "dist/"
]
wheel-exclude = [
    ".github/",
    ".gitignore/",
    ".precommit-config.yaml",
    ".venv/",
    "Makefile",
    "tests/"
]

# helps to guard against supply chain attacks
[tool.uv]
exclude-newer = "7 days"
